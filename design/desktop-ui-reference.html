function renderSide(){$('sidebar').hidden=!sideKeys.length;if(!sideKeys.length)return;const d=sideDefs[sideKeys[sideIndex]];$('sidecontent').innerHTML=d.html();$('sidecontent').scrollTop=0;$('pagerlabel').textContent=`${d.name}　${sideIndex+1} / ${sideKeys.length}`;if($('beach'))drawBeach()}
function stepSide(n){if(!sideKeys.length)return;sideIndex=(sideIndex+n+sideKeys.length)%sideKeys.length;renderSide()}function selectSide(k){if(!sideKeys.includes(k))return;sideIndex=sideKeys.indexOf(k);renderSide();paused=true;updatePause()}function updatePause(){$('pause').innerHTML=`<i class="mi">${paused?'play_arrow':'pause'}</i>`;$('pause').title=paused?'继续轮播':'暂停轮播'}function togglePause(){paused=!paused;updatePause()}setInterval(()=>{if(!paused&&sideKeys.length>1&&!document.hidden&&!$('sidebar').matches(':hover')&&$('dialog').hidden)stepSide(1)},5000);$('scenario').onchange=setScenario;
function drawBeach(){const c=$('beach').getContext('2d');c.translate(150,150);c.beginPath();c.arc(0,0,125,0,2*Math.PI);c.fillStyle='#fafafa';c.fill();c.save();c.clip();c.fillStyle='#df4444';c.fillRect(0,-125,125,125);c.fillRect(-125,0,125,125);c.strokeStyle='#111';c.lineWidth=2;c.beginPath();c.moveTo(-125,0);c.lineTo(125,0);c.moveTo(0,-125);c.lineTo(0,125);c.stroke();c.restore();c.beginPath();c.arc(0,0,125,0,Math.PI*2);c.stroke()}
function drawOverlay(s){const c=$('overlay').getContext('2d');c.clearRect(0,0,1792,1280);if(s==='all'||s==='eew'){for(const[r,col]of [[85,'#ffce76'],[130,'#7bd7eb']]){c.beginPath();c.arc(1028,673,r,0,2*Math.PI);c.lineWidth=2;c.strokeStyle=col;c.stroke();c.fillStyle=col+'12';c.fill()}}if(s!=='idle'){for(const[x,y,v]of [[936,613,3],[972,650,3],[916,680,2],[886,703,1],[953,594,2],[1002,577,1],[854,760,1],[864,797,0]]){c.fillStyle=['#caddeb','#9dcbe5','#87c9e6','#bdd46f'][v];c.fillRect(x,y,13,13);c.fillStyle='#14202a';c.font='bold 10px sans-serif';c.fillText(v,x+3,y+10)}}document.querySelector('.volcano').hidden=!['all','volcano'].includes(s);document.querySelector('.cross').hidden=s==='idle';document.querySelector('.maplabel').hidden=s==='idle'}
let camera={x:0,y:0,z:1},drag=null;function updateMap(){$('world').style.cssText=`--x:${camera.x}px;--y:${camera.y}px;--z:${camera.z}`}function zoom(d){camera.z=Math.max(.6,Math.min(2,camera.z+d));updateMap()}function resetMap(){camera={x:0,y:0,z:1};updateMap()}$('map').onpointerdown=e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,ox:camera.x,oy:camera.y};$('map').setPointerCapture(e.pointerId)};$('map').onpointermove=e=>{if(!drag)return;camera.x=drag.ox+e.clientX-drag.x;camera.y=drag.oy+e.clientY-drag.y;updateMap()};$('map').onpointerup=$('map').onpointercancel=()=>drag=null;
for(let y=10;y<15;y++)for(let x=24;x<31;x++){const img=new Image();img.alt='';img.draggable=false;img.src=`https://tile.openstreetmap.org/5/${x}/${y}.png`;$('tiles').append(img)}
function openEvent(name){const e=events.find(x=>x[1]===name);$('dialogtitle').textContent=name;$('dialogcontent').innerHTML=kv([['机构',e[0]],['震级','M'+e[3]],['深度',e[4]+' km'],['时间',e[5]],['数据性质','界面还原示例']]);$('dialog').hidden=false}function openDialog(title,text){$('dialogtitle').textContent=title;$('dialogcontent').innerHTML='<p>'+text+'</p>';$('dialog').hidden=false}function closeDialog(){$('dialog').hidden=true}document.onkeydown=e=>{if(e.key==='Escape')closeDialog()};renderList();setScenario();
</script></body></html>

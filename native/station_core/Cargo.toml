[package]
name = "rq_station_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["gif", "png", "bmp"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip"] }
serde = "=1.0.229"
libm = "=0.2.11"
sha2 = "=0.10.8"
base64 = "=0.22.1"
roxmltree = "=0.21.1"
crc32fast = "=1.5.2"

[target.'cfg(windows)'.dependencies]
mio = { version = "=1.2.4", default-features = false, features = ["os-poll", "net"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "=0.2.190"
mio = { version = "=1.2.4", default-features = false, features = ["os-poll", "net"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

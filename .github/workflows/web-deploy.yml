name: Deploy web to server

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhythmquake-web-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build web
        run: |
          flutter pub get
          flutter build web --release
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import os
          version = os.environ['GITHUB_SHA'][:12]
          index = Path('build/web/index.html')
          html = index.read_text()
          if html.count('__RQ_BUILD_VERSION__') != 1:
              raise SystemExit('Web build version placeholder missing or duplicated')
          if html.count('__RQ_MAIN_JS_BYTES__') != 1:
              raise SystemExit('Web main script size placeholder missing or duplicated')
          if html.count('__RQ_CANVASKIT_CHROMIUM_BYTES__') != 1 or html.count('__RQ_CANVASKIT_FULL_BYTES__') != 1:
              raise SystemExit('CanvasKit size placeholders missing or duplicated')
          html = html.replace('__RQ_BUILD_VERSION__', version)
          html = html.replace('__RQ_MAIN_JS_BYTES__', str(Path('build/web/main.dart.js').stat().st_size))
          for variant, files in {
              'CHROMIUM': ('canvaskit/chromium/canvaskit.js', 'canvaskit/chromium/canvaskit.wasm'),
              'FULL': ('canvaskit/canvaskit.js', 'canvaskit/canvaskit.wasm'),
          }.items():
              html = html.replace(f'__RQ_CANVASKIT_{variant}_BYTES__', str(sum(
                  Path('build/web', file).stat().st_size for file in files
              )))
          html = html.replace('src="flutter_bootstrap.js"', f'src="flutter_bootstrap.js?v={version}"')
          index.write_text(html)
          Path('build/web/version.json').write_text(json.dumps({
              'version': version,
              'builtAt': datetime.now(timezone.utc).isoformat(),
          }) + '\n')
          bootstrap = Path('build/web/flutter_bootstrap.js')
          source = bootstrap.read_text()
          target = '"mainJsPath":"main.dart.js"'
          if target not in source:
              raise SystemExit('Flutter bootstrap main script path not found')
          bootstrap.write_text(source.replace(target, f'"mainJsPath":"main.dart.js?v={version}"'))
          PY
      - name: Validate HTTPS Nginx config
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx >/dev/null
          sudo mkdir -p /etc/letsencrypt/live/eew.yuelinrhythm.top
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=eew.yuelinrhythm.top \
            -keyout /etc/letsencrypt/live/eew.yuelinrhythm.top/privkey.pem \
            -out /etc/letsencrypt/live/eew.yuelinrhythm.top/fullchain.pem \
            >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          source = Path('.github/workflows/web-deploy.yml').read_text()
          source = source.rsplit('cp /etc/nginx/conf.d/rhythmquake-eew.conf /etc/nginx/conf.d/rhythmquake-eew.conf.bak', 1)[1]
          match = re.search(r"cat > /etc/nginx/conf.d/rhythmquake-eew.conf <<'CONF'\n(.*?)\n          CONF", source, re.S)
          if match is None:
              raise SystemExit('HTTPS Nginx configuration not found')
          if 'location = /api/jian/auth/access' not in match.group(1):
              raise SystemExit('Jian auth proxy missing from HTTPS config')
          Path('/tmp/rhythmquake-eew.conf').write_text(textwrap.dedent(match.group(1)) + '\n')
          PY
          sudo cp /tmp/rhythmquake-eew.conf /etc/nginx/conf.d/rhythmquake-eew.conf
          sudo mkdir -p /var/cache/nginx/rhythmquake-sources
          sudo chown www-data:www-data /var/cache/nginx/rhythmquake-sources
          sudo nginx -t
      - uses: actions/upload-artifact@v4
        with:
          name: rhythmquake-deploy
          path: build/web/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rhythmquake-deploy
          path: site
      - name: Install SSH client tools
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Check domain and HTTPS ports
        env:
          SSHPASS: ${{ secrets.RHYTHMQUAKE_SSH_PASSWORD }}
        run: |
          echo 'eew.yuelinrhythm.top IPv4:'
          getent ahostsv4 eew.yuelinrhythm.top | awk '{print $1}' | sort -u || true
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -H 64.90.20.78 >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@64.90.20.78 'echo "HTTP/HTTPS listeners:"; ss -ltnp | grep -E ":(80|443)[[:space:]]" || true; echo "Nginx active:"; systemctl is-active nginx || true; echo "Domain Nginx config:"; if nginx -T 2>/dev/null | grep -Fq "server_name eew.yuelinrhythm.top"; then echo present; else echo absent; fi'
      - name: Deploy static files
        env:
          SSHPASS: ${{ secrets.RHYTHMQUAKE_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SSHPASS" ]; then
            echo 'Set the RHYTHMQUAKE_SSH_PASSWORD repository secret first.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -H 64.90.20.78 >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          deploy_id="${GITHUB_SHA:0:12}"
          remote=(sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@64.90.20.78)
          "${remote[@]}" "mkdir -p /var/www/rhythmquake/releases/$deploy_id"
          tar -C site -czf - . | "${remote[@]}" "tar -xz -C /var/www/rhythmquake/releases/$deploy_id"
          "${remote[@]}" "bash -se -- '$deploy_id'" <<'REMOTE'
          set -euo pipefail
          deploy_id="$1"
          if ! command -v nginx >/dev/null 2>&1; then
            if ! command -v apt-get >/dev/null 2>&1; then
              echo 'Nginx is missing and this server has no apt-get; install Nginx first.' >&2
              exit 1
            fi
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
          fi
          if [ ! -f /etc/nginx/conf.d/rhythmquake-web.conf ] && ss -ltn | grep -Eq '(^|[[:space:]])[^[:space:]]+:18080[[:space:]]'; then
            echo 'Port 18080 is already occupied; no web server configuration was changed.' >&2
            exit 1
          fi
          cat > /etc/nginx/conf.d/rhythmquake-web.conf <<'CONF'
          server {
              listen 18080;
              server_name _;
              root /var/www/rhythmquake/current;
              index index.html;
              location = / {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  try_files /index.html =404;
              }
              location = /index.html {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
              }
              location = /version.json {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  default_type application/json;
                  try_files $uri =404;
              }
              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          CONF
          mkdir -p /var/www/letsencrypt
          # Preserve the live HTTPS vhost during routine static deployments.
          # Replacing it with HTTP-only here briefly serves the file site's
          # certificate for eew until the later HTTPS step restores this vhost.
          if [ ! -f /etc/nginx/conf.d/rhythmquake-eew.conf ] || \
             ! grep -Fq 'listen 443 ssl;' /etc/nginx/conf.d/rhythmquake-eew.conf; then
            cat > /etc/nginx/conf.d/rhythmquake-eew.conf <<'CONF'
          server {
              listen 80;
              server_name eew.yuelinrhythm.top;
              root /var/www/rhythmquake/current;
              index index.html;
              location /.well-known/acme-challenge/ {
                  root /var/www/letsencrypt;
              }
              location = / {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  try_files /index.html =404;
              }
              location = /index.html {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
              }
              location = /version.json {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  default_type application/json;
                  try_files $uri =404;
              }
              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          CONF
          fi
          ln -sfn "releases/$deploy_id" /var/www/rhythmquake/next
          mv -Tf /var/www/rhythmquake/next /var/www/rhythmquake/current
          nginx -t
          systemctl enable --now nginx
          systemctl reload nginx
          if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
            ufw allow 18080/tcp
          fi
          curl --fail --silent --show-error http://127.0.0.1:18080/ -o /dev/null
          curl --fail --silent --show-error -H 'Host: eew.yuelinrhythm.top' http://127.0.0.1/ -o /dev/null
          REMOTE
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 http://64.90.20.78:18080/ -o /dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -H 'Host: eew.yuelinrhythm.top' http://64.90.20.78/ -o /dev/null
      - name: Enable HTTPS when DNS is ready
        env:
          SSHPASS: ${{ secrets.RHYTHMQUAKE_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          domain=eew.yuelinrhythm.top
          records=$(getent ahostsv4 "$domain" 2>/dev/null | awk '{print $1}' | sort -u || true)
          if [ "$records" != '64.90.20.78' ]; then
            echo "HTTPS pending: $domain must have only the A record 64.90.20.78 (found: ${records:-none})."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -H 64.90.20.78 >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@64.90.20.78 'bash -se' <<'REMOTE'
          set -euo pipefail
          if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
            ufw allow 80/tcp
            ufw allow 443/tcp
          fi
          if ! command -v certbot >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y certbot
          fi
          certbot certonly --webroot -w /var/www/letsencrypt \
            -d eew.yuelinrhythm.top --non-interactive --agree-tos \
            --register-unsafely-without-email --keep-until-expiring \
            --deploy-hook 'systemctl reload nginx'
          cp /etc/nginx/conf.d/rhythmquake-eew.conf /etc/nginx/conf.d/rhythmquake-eew.conf.bak
          mkdir -p /var/cache/nginx/rhythmquake-sources
          chown www-data:www-data /var/cache/nginx/rhythmquake-sources
          cat > /etc/nginx/conf.d/rhythmquake-eew.conf <<'CONF'
          proxy_cache_path /var/cache/nginx/rhythmquake-sources levels=1:2 keys_zone=rhythmquake_sources:16m inactive=30m max_size=512m;
          server {
              listen 80;
              server_name eew.yuelinrhythm.top;
              location /.well-known/acme-challenge/ {
                  root /var/www/letsencrypt;
              }
              location / {
                  return 301 https://$host$request_uri;
              }
          }
          server {
              listen 443 ssl;
              server_name eew.yuelinrhythm.top;
              ssl_certificate /etc/letsencrypt/live/eew.yuelinrhythm.top/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/eew.yuelinrhythm.top/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              gzip on;
              gzip_min_length 1024;
              gzip_comp_level 5;
              gzip_vary on;
              gzip_types application/javascript application/wasm text/css application/json;
              root /var/www/rhythmquake/current;
              index index.html;
              location = / {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  try_files /index.html =404;
              }
              location = /index.html {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
              }
              location = /version.json {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  default_type application/json;
                  try_files $uri =404;
              }
              location = /flutter_bootstrap.js {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
              }
              location = /flutter_service_worker.js {
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
              }
              location = /main.dart.js {
                  add_header Cache-Control "no-cache, must-revalidate" always;
              }
              location = /api/jian/auth/refresh {
                  limit_except POST { deny all; }
                  client_max_body_size 1k;
                  proxy_pass https://auth.sismotide.top/api/refresh;
                  proxy_ssl_server_name on;
                  proxy_set_header Host auth.sismotide.top;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location = /api/jian/auth/access {
                  limit_except POST { deny all; }
                  client_max_body_size 1k;
                  proxy_pass https://auth.sismotide.top/api/access;
                  proxy_ssl_server_name on;
                  proxy_set_header Host auth.sismotide.top;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location = /api/wauth/session {
                  limit_except POST { deny all; }
                  client_max_body_size 8k;
                  proxy_pass https://quake.yuelinrhythm.top/wauth/session;
                  proxy_ssl_server_name on;
                  proxy_set_header Host quake.yuelinrhythm.top;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 15s;
              }
              location = /api/wauth/result {
                  limit_except GET { deny all; }
                  access_log off;
                  proxy_pass https://quake.yuelinrhythm.top/wauth/result;
                  proxy_ssl_server_name on;
                  proxy_set_header Host quake.yuelinrhythm.top;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 15s;
              }
              location = /api/wauth/userinfo {
                  limit_except GET { deny all; }
                  proxy_pass https://quake.yuelinrhythm.top/wauth/userinfo;
                  proxy_ssl_server_name on;
                  proxy_set_header Host quake.yuelinrhythm.top;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 15s;
              }
              location = /api/wauth/api/token/verify {
                  limit_except POST { deny all; }
                  proxy_pass https://quake.yuelinrhythm.top/wauth/api/token/verify;
                  proxy_ssl_server_name on;
                  proxy_set_header Host quake.yuelinrhythm.top;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 15s;
              }
              location = /api/palert/graphql/ {
                  limit_except POST { deny all; }
                  client_max_body_size 64k;
                  proxy_pass https://palert.earth.sinica.edu.tw/graphql/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host palert.earth.sinica.edu.tw;
                  proxy_set_header Origin https://palert.earth.sinica.edu.tw;
                  proxy_set_header Referer https://palert.earth.sinica.edu.tw/realtime;
                  proxy_set_header User-Agent FlutterRhythmQuake/1.0;
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 15s;
              }
              location /api/lmoni/ {
                  proxy_pass https://www.lmoni.bosai.go.jp/img_svr/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host www.lmoni.bosai.go.jp;
                  proxy_set_header Referer https://www.lmoni.bosai.go.jp/monitor/;
                  proxy_set_header User-Agent 'Mozilla/5.0 RhythmQuake-Web';
                  proxy_set_header Origin "";
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 8s;
              }
              location /api/lpgm-image/ {
                  limit_except GET { deny all; }
                  proxy_pass https://www.lmoni.bosai.go.jp/monitor/data/data/map_img/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host www.lmoni.bosai.go.jp;
                  proxy_set_header Referer https://www.lmoni.bosai.go.jp/monitor/;
                  proxy_set_header User-Agent 'Mozilla/5.0 RhythmQuake-Web';
                  proxy_set_header Origin "";
                  proxy_cache rhythmquake_sources;
                  proxy_cache_lock on;
                  proxy_cache_valid 200 10m;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 8s;
              }
              location /api/china-weather-media/ {
                  limit_except GET { deny all; }
                  proxy_pass https://d1.weather.com.cn/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host d1.weather.com.cn;
                  proxy_set_header Referer https://www.weather.com.cn/;
                  proxy_set_header User-Agent 'Mozilla/5.0';
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location /api/china-weather-location/ {
                  limit_except GET { deny all; }
                  proxy_pass https://d4.weather.com.cn/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host d4.weather.com.cn;
                  proxy_set_header Referer https://m.weather.com.cn/;
                  proxy_set_header User-Agent 'Mozilla/5.0';
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 15s;
              }
              location /api/cma-weather/ {
                  limit_except GET { deny all; }
                  proxy_pass https://weather.cma.cn/api/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host weather.cma.cn;
                  proxy_set_header Referer https://weather.cma.cn/;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location /api/jma-bosai/ {
                  limit_except GET { deny all; }
                  proxy_pass https://www.jma.go.jp/bosai/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host www.jma.go.jp;
                  proxy_set_header Referer https://www.jma.go.jp/;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location /api/zhejiang-weather/ {
                  limit_except GET { deny all; }
                  proxy_pass https://typhoon.slt.zj.gov.cn/Api/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host typhoon.slt.zj.gov.cn;
                  proxy_set_header Referer https://typhoon.slt.zj.gov.cn/;
                  proxy_set_header User-Agent 'Mozilla/5.0';
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location /api/china-weather-alert-list/ {
                  limit_except GET { deny all; }
                  proxy_pass https://forecast.weather.com.cn/api/v1/traffic/alarm/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host forecast.weather.com.cn;
                  proxy_set_header Referer https://www.weather.com.cn/alarm/index.shtml;
                  proxy_set_header User-Agent 'Mozilla/5.0';
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location /api/china-weather-alert-detail/ {
                  limit_except GET { deny all; }
                  proxy_pass https://product.weather.com.cn/alarm/webdata/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host product.weather.com.cn;
                  proxy_set_header Referer https://www.weather.com.cn/alarm/index.shtml;
                  proxy_set_header User-Agent 'Mozilla/5.0';
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location /api/jma-xml/ {
                  limit_except GET { deny all; }
                  proxy_pass https://www.data.jma.go.jp/developer/xml/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host www.data.jma.go.jp;
                  proxy_set_header Referer https://www.data.jma.go.jp/;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location /api/nsmc/ {
                  limit_except GET { deny all; }
                  proxy_pass https://data.nsmc.org.cn/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host data.nsmc.org.cn;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 30s;
              }
              location /api/kmoni/ {
                  proxy_pass http://www.kmoni.bosai.go.jp/;
                  proxy_set_header Host www.kmoni.bosai.go.jp;
                  proxy_set_header Referer http://www.kmoni.bosai.go.jp/;
                  proxy_set_header User-Agent 'Mozilla/5.0 RhythmQuake-Web';
                  proxy_set_header Origin "";
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 8s;
              }
              location /api/snet/ {
                  proxy_pass https://www.msil.go.jp/data/tiles/smoni/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host www.msil.go.jp;
                  proxy_set_header Referer https://www.msil.go.jp/map/ja/;
                  proxy_set_header Origin "";
                  proxy_connect_timeout 10s;
                  proxy_read_timeout 20s;
              }
              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          CONF
          if nginx -t; then
            systemctl reload nginx
            rm -f /etc/nginx/conf.d/rhythmquake-eew.conf.bak
          else
            mv -f /etc/nginx/conf.d/rhythmquake-eew.conf.bak /etc/nginx/conf.d/rhythmquake-eew.conf
            exit 1
          fi
          if systemctl list-unit-files certbot.timer --no-legend 2>/dev/null | grep -q 'certbot.timer'; then
            systemctl enable --now certbot.timer
          fi
          echo 'Configured certificate:'
          openssl x509 -in /etc/letsencrypt/live/eew.yuelinrhythm.top/fullchain.pem \
            -noout -subject -ext subjectAltName
          echo 'Certificate presented by local Nginx:'
          openssl s_client -connect 127.0.0.1:443 \
            -servername eew.yuelinrhythm.top </dev/null 2>/dev/null | \
            openssl x509 -noout -subject -ext subjectAltName
          curl --fail --silent --show-error --noproxy '*' \
            --resolve eew.yuelinrhythm.top:443:127.0.0.1 \
            https://eew.yuelinrhythm.top/ -o /dev/null
          REMOTE
          curl --fail --silent --show-error --noproxy '*' --connect-timeout 10 --max-time 30 \
            --resolve eew.yuelinrhythm.top:443:64.90.20.78 \
            https://eew.yuelinrhythm.top/ -o /dev/null
